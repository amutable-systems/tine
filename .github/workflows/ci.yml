name: ci

on:
  # TODO: narrow to pull_request once we move from pushing branches to PRs.
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # buck's mkosi-sandbox needs unprivileged user namespaces (unshare(CLONE_NEWUSER)); Ubuntu
      # restricts them via AppArmor, so lift the restriction.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Set up /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm --settle
          ls -l /dev/kvm

      # verify-catalog shells out to `git -C <catalog>`, which trips git's safe.directory guard on a
      # checkout owned by another uid.
      - name: Set up git
        run: git config --global --add safe.directory '*'

      # the actual pipeline (bootstrap, linters, catalog, image builds, and VM boot smokes)
      # emits a log group per step
      - name: CI
        run: tools/ci.sh

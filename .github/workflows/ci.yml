name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # a run on main records whether that commit is green, so let it finish even after the next merge
  # has landed
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    strategy:
      # One architecture or box failing says nothing about the others, and which one broke is the
      # first thing worth knowing.
      fail-fast: false
      matrix:
        # architecture is tine's name for it, as in platforms/architecture.bzl. box names the release
        # whose boxes the run builds with, and an empty box keeps the catalog's default. A run with
        # another release's boxes only builds and tests what depends on the default boxes. Only a run
        # with the default boxes checks the digests in examples/image/expected.json. Arch serves x86_64
        # only.
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
            box: ""
          - runner: ubuntu-24.04-arm
            architecture: arm64
            box: ""
          - runner: ubuntu-24.04
            architecture: x86_64
            box: arch.rolling
          - runner: ubuntu-24.04
            architecture: x86_64
            box: debian.testing
    # The ruleset of main requires the checks `build (ubuntu-24.04)` and `build (ubuntu-24.04-arm)`.
    # A run with the default boxes keeps that name, because a PR otherwise waits for those checks forever.
    name: build (${{ matrix.runner }}${{ matrix.box && format(', {0}', matrix.box) || '' }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/gh-runner-setup

      # the actual pipeline (bootstrap, linters, catalog, image builds, and VM boot smokes)
      # emits a log group per step
      - name: CI
        run: tools/ci.sh
        env:
          TINE_BOX: ${{ matrix.box }}

      # If examples/image:reproducibility-test fails, for easy pickup. Unarchived, the artifact is the
      # file itself, under its own name.
      - name: Upload actual reproducibility digests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: examples/image/actual.${{ matrix.architecture }}.json
          archive: false
          if-no-files-found: ignore

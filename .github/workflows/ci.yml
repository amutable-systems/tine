name: ci

on:
  # TODO: narrow to pull_request once we move from pushing branches to PRs.
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # buck's mkosi-sandbox needs unprivileged user namespaces (unshare(CLONE_NEWUSER)); Ubuntu
      # restricts them via AppArmor, so lift the restriction.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Set up /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm --settle
          ls -l /dev/kvm

      # verify-catalog shells out to `git -C <catalog>`, which trips git's safe.directory guard on a
      # checkout owned by another uid.
      - name: Set up git
        run: git config --global --add safe.directory '*'

      # First buck invocation: fetch the pinned buck binary and build the engine (the RPM-resolved
      # toolchain every later step shares), so each step's timing reflects its own work.
      - name: Bootstrap buck and the engine
        run: tools/buck build tine//catalog:fedora.rawhide.engine

      - name: Linters and unit tests
        run: tools/buck run tine//tools:check

      # Scoped to the rpmrepo snapshotted rawhide engine; CentOS Stream mirrors
      # are intentionally unpinned and drift, so they are not verifiable.
      - name: Verify catalog
        run: tools/buck run tine//tools:verify-catalog -- --engine fedora.rawhide.engine

      - name: Build the dev box
        run: tools/buck build //examples/box:box

      - name: Build boot-demo image
        run: tools/buck build //examples/image:boot-demo

      # Boot the image in a VM and drive its console over a pty: wait for the autologin shell, assert
      # the system settled (degraded is tolerated for now), then power off.
      - name: Boot-test boot-demo
        run: tools/buck run //examples/image:boot-demo-vm-smoke

      - name: Build Secure Boot image
        run: tools/buck build //examples/image-secureboot:image

      # Boot with Secure Boot enforced and a vTPM: enroll the keys on first boot, smoke-check, then
      # power off. Exercises the signed UKI/systemd-boot and the measured expected-PCR policy.
      - name: Boot-test Secure Boot image
        run: tools/buck run //examples/image-secureboot:vm-smoke

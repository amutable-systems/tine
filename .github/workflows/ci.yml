name: ci

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # a run on main records whether that commit is green, so let it finish even after the next merge
  # has landed
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    strategy:
      # the point of the arm64 leg is to learn where it stands, which a cancelled x86 leg hides
      fail-fast: false
      matrix:
        # there is no `-latest` arm label, so both legs name the release: they then differ in
        # nothing but the architecture, and move on together, by hand
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/gh-runner-setup

      # the actual pipeline (bootstrap, linters, catalog, image builds, and VM boot smokes)
      # emits a log group per step
      - name: CI
        run: tools/ci.sh

# Tooling for the in-tree Python drivers.

[tool.ruff]
target-version = "py314"
line-length = 109
# Exclude build outputs and the verbatim vendored sandbox.
extend-exclude = ["buck-out", "vendor/mkosi/sandbox.py"]
# A command carries no suffix for the linters to recognize it by.
extend-include = ["bin/tine"]
# tine runs on whatever python the host has, before anything is fetched, so pyupgrade must not
# rewrite it to syntax newer than the floor the README promises.
per-file-target-version = { "bin/tine" = "py39" }
src = [
    "archive",
    "cargo",
    "box",
    "image",
    "image_format",
    "package",
    "package_system/pacman",
    "package_system/rpm",
    "rootfs",
    "vendor",
]
lint.select = [
    "E",    # pycodestyle
    "W",    # pycodestyle (trailing whitespace)
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "ANN",  # flake8-annotations
    # A union annotation that the file's own target python evaluates as a TypeError, which is
    # what keeps bin/tine's quoted ones quoted.
    "FA102",
]

[tool.ruff.lint.per-file-ignores]
# Keep the vendored implementation byte-for-byte identical after its provenance header.
"vendor/mkosi/versioncomp.py" = ["ANN204"]
